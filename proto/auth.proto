syntax = "proto3";

package auth;

service AuthService {
    rpc Register(RegisterRequest) returns (RegisterResponse);
    rpc Login(LoginRequest) returns (LoginResponse);
}

message RegisterRequest{
    string firstname = 1;
    string lastname = 2;
    string email = 3;
    string password = 4;
    string confirmPass = 5;
    int32 role = 6;
}

message RegisterResponse{
    bool success = 1;
    string message = 2;
}

message LoginRequest{
    string email = 1;
    string password = 2;
    int32 role = 3;
}

message LoginResponse{
    bool success = 1;
    string accessToken = 2;
    string refreshToken = 3;
    string message = 4;
}